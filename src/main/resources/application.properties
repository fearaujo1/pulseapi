spring.application.name=pulsepi

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pulseapi;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=150109
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta da aplicação
server.port=8080

api.security.token.secret=autopackproject-pulseapi

# Capacidade utilizada pelo PulseAPI.
# A impressora suporta até 4096, mas começaremos com 50.
pulseapi.fila-impressao.capacidade-buffer=50

# Quando o FIFO chegar a 20 ou menos, será completado até 50.
pulseapi.fila-impressao.nivel-reposicao=20

# Frequência de sincronização com a impressora.
pulseapi.fila-impressao.intervalo-ms=200

# Monitoramento Domino
pulseapi.domino.monitoramento.enabled=true
pulseapi.domino.monitoramento.ocorrencias-enabled=false
pulseapi.domino.monitoramento.todos-equipamentos-enabled=true
pulseapi.domino.monitoramento.connection-timeout-ms=3000
pulseapi.domino.monitoramento.inactivity-timeout-ms=60000
pulseapi.domino.monitoramento.initial-reconnect-delay-ms=5000
pulseapi.domino.monitoramento.max-reconnect-delay-ms=300000
pulseapi.domino.monitoramento.reconciliation-interval-ms=30000
pulseapi.domino.monitoramento.startup-jitter-max-ms=10000
pulseapi.domino.monitoramento.max-historical-events=16
pulseapi.domino.monitoramento.max-missed-heartbeats=2